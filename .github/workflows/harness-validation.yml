name: Harness validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and browser-contract tests
        run: npm run test:unit

      - name: Operating gates and replay invariants
        run: npm run test:operating-gates

      - name: Build
        run: npm run build

      - name: Offline smoke
        run: npm run test:offline

      - name: Scripted evaluation catalog
        run: npm run test:evals:offline
